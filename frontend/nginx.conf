server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads de materiais passam por aqui. O teto de verdade é MAX_UPLOAD_MB na
    # API (30 MB por arquivo); este só precisa ser maior, senão o nginx recusa
    # com 413 antes de a API poder responder com a mensagem de domínio.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A API não tem prefixo de rota e a SPA também usa /sessoes/:id, então o
    # navegador chama a API sob /api. A barra final no proxy_pass é o que remove
    # o prefixo — é a mesma reescrita do proxy do Vite em desenvolvimento.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Geração e auditoria chamam LLM local em série (LLM_TIMEOUT_S = 180 por
        # chamada, com fallback); o padrão de 60 s derrubaria o pedido com 504.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Assets do Vite têm hash no nome: nunca mudam sob o mesmo nome.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback da SPA: rotas do TanStack Router não existem como arquivo.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

name: docencia

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ escapa o "$" pro shell do container resolver as vars injetadas via
      # env_file (POSTGRES_USER/POSTGRES_DB), não pro Compose interpolar aqui.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STORAGE_DIR: /app/storage
      EMBEDDING_BASE_URL: http://host.docker.internal:11434
      RERANK_BASE_URL: http://host.docker.internal:11434
      LLM_BASE_URL: http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Só loopback: o acesso do docente é pelo "web". Fica publicada para o
      # /docs do Swagger, que sob /api não funciona (openapi.json é absoluto).
      - "127.0.0.1:8000:8000"
    volumes:
      - storage_data:/app/storage

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
  storage_data:

[project]
name = "docencia"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "bcrypt>=5.0.0",
    "pyjwt>=2.9",
    "alembic>=1.20.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "httpx>=0.28.1",
    "latex2mathml==3.78.0",
    "pint==0.25.2",
]
[tool.fastapi]
entrypoint = "backend.app.main:app"

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.ruff.lint.flake8-bugbear]
# B008: Depends()/Query() em default de argumento é o idiom padrão do
# FastAPI — falso positivo, não uma mutable default de verdade.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
